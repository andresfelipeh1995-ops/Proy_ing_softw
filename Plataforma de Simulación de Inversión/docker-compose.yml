name: investsim

services:
  db:
    image: postgres:16-alpine
    container_name: investsim-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investsim}
      POSTGRES_USER: ${POSTGRES_USER:-investsim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investsim123}
    volumes:
      - investsim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investsim} -d ${POSTGRES_DB:-investsim}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: investsim-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-investsim}
      DB_USERNAME: ${POSTGRES_USER:-investsim}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-investsim123}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-cambie-este-secreto-por-uno-de-mas-de-32-caracteres}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-2}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@investsim.co}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      DEFAULT_INITIAL_BALANCE: ${DEFAULT_INITIAL_BALANCE:-100000}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      ALPHA_VANTAGE_BASE_URL: ${ALPHA_VANTAGE_BASE_URL:-https://www.alphavantage.co}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      TWELVE_DATA_BASE_URL: ${TWELVE_DATA_BASE_URL:-https://api.twelvedata.com}
      STOOQ_BASE_URL: ${STOOQ_BASE_URL:-https://stooq.com}
      SYNTHETIC_MARKET_DATA_ENABLED: ${SYNTHETIC_MARKET_DATA_ENABLED:-true}
      SYNTHETIC_BASE_PRICE: ${SYNTHETIC_BASE_PRICE:-100}
      INGESTION_ENABLED: ${INGESTION_ENABLED:-true}
      INGESTION_CRON: ${INGESTION_CRON:-0 0 */6 * * *}
      INGESTION_HISTORY_DAYS: ${INGESTION_HISTORY_DAYS:-365}
    ports:
      - "${BACKEND_PORT:-8082}:8082"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: investsim-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5500}:80"

volumes:
  investsim_pgdata:
